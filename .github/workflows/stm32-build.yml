name: Build STM32 Firmware

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build STM32 firmware
        run: |
          mkdir -p build
          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -Wall \
            -g \
            -O0 \
            -ffreestanding \
            -nostdlib \
            src/main.c \
            -o build/stm32_firmware.elf